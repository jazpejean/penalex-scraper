name: Masivo TSJ

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sala: [scp, scon]
        anio: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
               2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
               2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          pip install curl_cffi playwright requests urllib3
          python -m playwright install --with-deps chromium
      - name: Scrapear ${{ matrix.sala }} ${{ matrix.anio }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          MAX_DOCS: '999999'
          DELAY: '1.5'
        run: python scraper_tsj.py --sala ${{ matrix.sala }} --anio ${{ matrix.anio }}
